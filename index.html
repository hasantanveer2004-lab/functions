
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Functions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>JavaScript Functions</h1>

        <h2>Addition Function</h2>
        <input type="number" id="num1" placeholder="Enter first number">
        <input type="number" id="num2" placeholder="Enter second number">
        <button onclick="addNumbers()">Add Numbers</button>
        <p id="result"></p>

        <hr>

        <h2>Even or Odd Function</h2>
        <input type="number" id="number" placeholder="Enter a number">
        <button onclick="checkNumber()">Check Number</button>
        <p id="answer"></p>

        <hr>

        <h2>Multiplication Function</h2>
        <input type="number" id="multiply" placeholder="Enter a number">
        <button onclick="multiplyNumber()">Multiply</button>
        <p id="table"></p>

        <hr>

        <h2>Greeting Function</h2>
        <input type="text" id="username" placeholder="Enter your name">
        <button onclick="greetUser()">Greet Me</button>
        <p id="greeting"></p>

    </div>

    <script src="script.js"></script>
</body>
</html>
